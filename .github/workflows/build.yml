name: Build StormOS ISOs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [ install-stormos-xfce, install-stormos-kde ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ISO in privileged Arch container
        # mkarchiso must mount /proc inside the airootfs while installing
        # packages, which GitHub's unprivileged `container:` jobs cannot do.
        # Run it inside a privileged docker container from the VM host instead.
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}":/repo -w /repo \
            archlinux:base-devel \
            bash -ec '
              pacman -Sy --noconfirm archlinux-keyring
              pacman -Syu --noconfirm archiso grub syslinux
              cd "${{ matrix.profile }}"
              ./build.sh -v
            '

      - name: Generate SHA256SUMS
        run: |
          cd "${{ matrix.profile }}/out"
          sha256sum *.iso > SHA256SUMS
          cat SHA256SUMS

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile }}-iso
          path: |
            ${{ matrix.profile }}/out/*.iso
            ${{ matrix.profile }}/out/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
