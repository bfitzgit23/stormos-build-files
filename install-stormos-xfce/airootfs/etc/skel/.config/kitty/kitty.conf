# StormOS Kitty Terminal Configuration
# Matches StormOS XFCE terminal theme with larger font

# ─── Font ────────────────────────────────────────────────────────────────────
font_family      JetBrains Mono Nerd Font
bold_font        JetBrains Mono Nerd Font Bold
italic_font      JetBrains Mono Nerd Font Italic
bold_italic_font JetBrains Mono Nerd Font Bold Italic
font_size        11.0

# ─── Window ──────────────────────────────────────────────────────────────────
window_padding_width 8
hide_window_decorations no
confirm_os_window_close 1
initial_window_width  90c
initial_window_height 28c

# ─── Background & Transparency ───────────────────────────────────────────────
background_opacity 0.88
dynamic_background_opacity yes

# ─── Cursor ──────────────────────────────────────────────────────────────────
cursor_shape          block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# ─── Scrollback ──────────────────────────────────────────────────────────────
scrollback_lines 10000

# ─── Mouse ───────────────────────────────────────────────────────────────────
copy_on_query_clipboard yes
mouse_hide_wait 3.0
url_style curly

# ─── Bell ────────────────────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0

# ─── Tab Bar ─────────────────────────────────────────────────────────────────
tab_bar_edge bottom
tab_bar_style fade
tab_powerline_style slanted

# ─── Shell ───────────────────────────────────────────────────────────────────
shell_integration enabled

# ═══════ StormOS Color Theme ═════════════════════════════════════════════════
# Dark navy background with electric blue accents

# Background & Foreground
background            #0A1628
foreground            #E8F2FF

# Cursor
cursor                #19A9FF
cursor_text_color     #0A1628

# Selection
selection_background  #0A1628
selection_foreground  #19A9FF

# URL hover
url_color             #19A9FF

# Tab bar
active_tab_background   #0A1628
active_tab_foreground   #19A9FF
inactive_tab_background #0f1d30
inactive_tab_foreground #4B5563

# Normal colors (StormOS palette)
color0  #0A1628  # Black
color1  #FF6B6B  # Red
color2  #19A9FF  # Green → StormOS Blue
color3  #FFD93D  # Yellow
color4  #19A9FF  # Blue
color5  #C778DD  # Magenta
color6  #56B6C2  # Cyan
color7  #E8F2FF  # White

# Bright colors
color8  #4B5563  # Bright Black
color9  #FF6B6B  # Bright Red
color10 #56B6C2  # Bright Green
color11 #FFD93D  # Bright Yellow
color12 #19A9FF  # Bright Blue
color13 #C778DD  # Bright Magenta
color14 #56B6C2  # Bright Cyan
color15 #E8F2FF  # Bright White
