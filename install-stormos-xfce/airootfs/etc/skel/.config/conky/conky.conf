-- StormOS System Overview Sidebar
-- Matches the React desktop system panel

conky.config = {
    alignment = 'top_right',
    background = true,
    double_buffer = true,
    font = 'JetBrains Mono Nerd Font:size=11',
    gap_x = 20,
    gap_y = 60,
    minimum_height = 500,
    minimum_width = 280,
    no_buffers = true,
    out_to_console = false,
    out_to_x = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_colour = '0A1628',
    own_window_argb_visual = true,
    own_window_argb_value = 200,
    short_units = true,
    update_interval = 2.0,
    use_xft = true,
    xftalpha = 1.0,
    override_utf8_locale = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    stippled_borders = 0,
    border_inner_margin = 15,
    border_outer_margin = 10,
    default_color = 'E8F2FF',
    color1 = '19A9FF',
    color2 = 'FFD93D',
    color3 = '56B6C2',
    color4 = 'C778DD',
    color5 = 'FF6B6B',
    color6 = '4B5563',
};

conky.text = [[
${color1}${font JetBrains Mono Nerd Font:bold:size=16}STORMOS${font}${color}
${color6}─────────────────────────────${color}

${color1}${font JetBrains Mono Nerd Font:bold:size=10}SYSTEM OVERVIEW${font}${color}
${color6}─────────────────────────────${color}

${color1}OS${color} ${alignr}${color}StormOS (Arch Linux)${color}
${color1}Kernel${color} ${alignr}${color}${sysname} ${kernel}${color}
${color1}Uptime${color} ${alignr}${color}${uptime_short}${color}
${color1}Packages${color} ${alignr}${color}${exec pacman -Q 2>/dev/null | wc -l}${color}

${color6}─────────────────────────────${color}
${color1}HARDWARE${font}${color}
${color6}─────────────────────────────${color}

${color1}CPU${color} ${alignr}${color}${cpu cpu0}%${color}
${execi 10 cat /proc/cpuinfo | grep 'model name' | head -1 | sed 's/.*: //'}
${color}${cpubar cpu0 8}${color}

${color1}GPU${color} ${alignr}${color}
${execi 10 lspci 2>/dev/null | grep -Ei 'vga|3d|display' | head -1 | sed 's/.*: //'}

${color1}Memory${color} ${alignr}${color}${mem} / ${memmax} (${memperc}%)${color}
${color}${membar 8}${color}

${color6}─────────────────────────────${color}
${color1}STORAGE${color}
${color6}─────────────────────────────${color}

${color1}/${color} ${alignr}${color}${fs_used /} / ${fs_size /} (${fs_used_perc /}%)${color}
${color}${fs_bar 8 /}${color}

${color6}─────────────────────────────${color}
${color1}NETWORK${color}
${color6}─────────────────────────────${color}

${color1}Wi-Fi${color} ${alignr}${color}${if_existing /proc/net/wireless}Connected${else}Disconnected${endif}${color}
${if_existing /proc/net/wireless}
${color1}IP${color} ${alignr}${color}${addr wlan0}${color}
${color1}↓${color} ${downspeed wlan0} ${color1}↑${color} ${upspeed wlan0}${color}
${endif}

${color6}─────────────────────────────${color}

${color1}${font JetBrains Mono Nerd Font:italic:size=10}Built for What's Next${font}${color}
]];
