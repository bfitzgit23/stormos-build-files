# /etc/calamares/modules/removeuser.conf
#
# Removes the "liveuser" live-session user from the installed system
# (userdel -r). The file previously had a leading space on the first line
# (" username: liveuser"), which is invalid YAML and made calamares load
# this module with an empty config -- the module then silently did nothing.
username: liveuser
