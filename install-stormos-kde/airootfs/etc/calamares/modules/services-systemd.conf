---
# StormOS KDE services

units:
  - name: NetworkManager.service
    action: enable
    mandatory: true
  - name: lightdm.service
    action: enable
    mandatory: true
  # plasma-meta depends on plasmalogin, so it lands in the target as an
  # installed unit. Leaving it enabled alongside lightdm gives the installed
  # system two display managers fighting over the VT; disable it, and let a
  # missing unit stay a non-fatal no-op.
  - name: plasmalogin.service
    action: disable
    mandatory: false
  - name: bluetooth.service
    action: enable
    mandatory: true
  - name: sshd.service
    action: enable
    mandatory: true
  - name: fstrim.timer
    action: enable
    mandatory: true
  - name: pacman-init.service
    action: disable
    mandatory: false
