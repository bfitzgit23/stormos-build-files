general.live_config_reload = true

[colors.bright]
black = "0x4B5563"
blue = "0x19A9FF"
cyan = "0x56B6C2"
green = "0x56B6C2"
magenta = "0xC778DD"
red = "0xFF6B6B"
white = "0xE8F2FF"
yellow = "0xFFD93D"

[colors.normal]
black = "0x0A1628"
blue = "0x19A9FF"
cyan = "0x56B6C2"
green = "0x56B6C2"
magenta = "0xC778DD"
red = "0xFF6B6B"
white = "0xE8F2FF"
yellow = "0xFFD93D"

[colors.primary]
background = "0x0A1628"
foreground = "0xE8F2FF"

[font]
size = 11

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrains Mono"
style = "Bold Italic"

[font.offset]
x = 0
y = 1

[window]
dynamic_padding = true
opacity = 0.90
title = "StormOS Terminal"

[window.class]
general = "Alacritty"
instance = "Alacritty"

[scrolling]
history = 5000

[window.padding]
x = 8
y = 8

[env]
TERM = "xterm-256color"
