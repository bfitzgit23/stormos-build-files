# StormOS picom compositor config for XFCE
# Provides transparency and shadows for the dark theme

backend = "glx";
vsync = true;
use-damage = true;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.6;

shadow-exclude = [
    "class_g = 'xfce4-panel'",
    "class_g = 'DockbarX'",
    "class_g = 'Polybar'",
    "class_g = 'panel'",
    "_GTK_FRAME_EXTENTS@:c"
];

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# Transparency
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 0.95;
inactive-opacity-override = false;

focus-exclude = [
    "class_g = 'Cairo-clock'",
    "class_g = 'Bar'",
    "class_g = 'slop'"
];

opacity-rule = [
    "100:class_g = 'firefox'",
    "100:class_g = 'Thunar'",
    "100:class_g = 'xfce4-terminal'",
    "95:class_g = 'Rofi'"
];

# Corners
corner-radius = 8;

rounded-corners-exclude = [
    "class_g = 'xfce4-panel'"
];

# Background blur (subtle)
blur-method = "dual_kawase";
blur-strength = 3;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# Window type settings
wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.9; };
    dock = { shadow = false; clip-shadow-above = true; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.95; };
    dropdown_menu = { opacity = 0.95; };
};
