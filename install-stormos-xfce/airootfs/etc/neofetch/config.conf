# StormOS Neofetch Configuration
# Custom ASCII art and branding

# Display Settings
title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="on"
os_arch="off"
uptime_shorthand="tiny"
memory_percent="on"
memory_unit="gib"
package_managers="on"
shell_path="off"
shell_version="on"
speed_type="bioslimit"
speed_shorthand="on"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="off"
gpu_brand="on"
gpu_type="all"
gtk_shorthand="on"
gtk2="off"
gtk3="on"
disk_show="total"
disk_subtitle="mount"
colors=(distro)
bold="on"
underline_enabled="on"
underline_char="-"
separator=":"
color_blocks="on"
block_width=3
block_range=(0 15)

# Image Settings
image_backend="ascii"
image_source="auto"
ascii_distro="auto"
ascii_colors=(distro)
ascii_bold="on"
image_loop="off"
thumbnail_dir=""
crop_mode="normal"
crop_offset="center"
image_size="auto"
gap=3
yoffset=0
xoffset=0
background_color=

# Color Overrides
color_title=(1, 3, 1, 0, 1, 15)
color_at="(textinfo)"
color_underline="(accent)"

# Custom ASCII Art for StormOS
ascii_distro="StormOS"

# Small ASCII (auto-selected based on terminal width)
# StormOS lightning bolt logo

# Info Display
print_info() {
    info title
    info underline

    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "DE" de
    info "WM" wm
    info "WM Theme" wm_theme
    info "Theme" theme
    info "Icons" icons
    info "Terminal" term
    info "Terminal Font" term_font
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory

    info "GPU Driver" gpu_driver 2>/dev/null

    info cols
}

# Title
title_fqdn="$hostname"

# Custom Colors
colors=(0, 6, 0, 6, 0, 15)

# Custom ASCII Art
# StormOS lightning bolt
ascii_distro='
       .--.
      |o_o |
      |:_/ |
     //   \ \
    (|     | )
   /'\_   _/`\
   \___)=(___/
'

# Distro specific
distro="StormOS"
distro_release="rolling"
distro_date="2024"
