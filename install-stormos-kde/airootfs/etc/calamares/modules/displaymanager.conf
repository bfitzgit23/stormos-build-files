---
# StormOS KDE display manager configuration

# lightdm is this edition's display manager (packages.x86_64), and the live
# media boots with it. plasma-meta still pulls plasmalogin in as a dependency,
# so it is present in the target even though nothing enables it; listing it
# first here made Calamares configure plasmalogin and hand the installed system
# a second, competing display manager. lightdm stays first so Calamares writes
# the LightDM settings; the rest are only fallbacks for a target without it.
displaymanagers:
  - lightdm
  - sddm
  - gdm
  - lxdm

basicSetup: false

lightdm:
  preferred_greeters:
    - lightdm-greeter.desktop
    - slick-greeter.desktop

sddm:
  configuration_file: /etc/sddm.conf
