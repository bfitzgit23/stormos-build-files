---
# initcpiocfg adds crc32c / crc32c-intel to MODULES= when the root filesystem
# is btrfs. On kernels >= 7.0 crc32c is built into the kernel image, so there
# is no module file and mkinitcpio fails with "module not found: 'crc32c'".
# (linux-lts 6.x still ships it as a module, which is why btrfs installs only
# broke on the mainline/zen kernels.) Stripping the tokens is safe on every
# kernel: on 7.x the checksum is built in, and on 6.x it is a dependency of
# btrfs.ko, so it is pulled in either way.
dontChroot: false
timeout: 120

script:
    - command: "sed -i -E 's/\\bcrc32c(-intel|_intel)?\\b//g' /etc/mkinitcpio.conf"
