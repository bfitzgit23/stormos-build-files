---
# StormOS XFCE — AetherDE session configuration.
# Runs in the target chroot after the main postinstall and the displaymanager
# module, so LightDM defaults are applied last.

i18n:
      name: "Configuring AetherDE"

dontChroot: false
timeout: 300
script:
     - command: "CALAMARES_TARGET_ROOT='${ROOT}' /usr/local/bin/aetherde-postinstall.sh"
