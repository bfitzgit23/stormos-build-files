# StormOS Conky — System Overview Panel (top-right, matching branding)
# Requires: conky (with lua), JetBrains Mono Nerd Font

conky.config = {
    alignment = 'top_right',
    gap_x = 20,
    gap_y = 60,
    minimum_width = 320,
    minimum_height = 500,
    own_window = true,
    own_window_type = 'dock',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 140,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    use_xft = true,
    font = 'JetBrains Mono Nerd Font:size=10',
    default_color = 'E8F2FF',
    color1 = '19A9FF',
    color2 = '8FA8C8',
    color3 = '2CB5FF',
    update_interval = 2,
    cpu_avg_samples = 2,
    no_buffers = true,
    uppercase = false,
    format_human_readable = true,
    lua_load = '~/.config/conky/stormos-rings.lua',
    lua_draw_hook_post = 'main_rings',
}

conky.text = [[
${font JetBrains Mono Nerd Font:bold:size=14}${color1}STORMOS  ${font :size=10}${color2}SYSTEM OVERVIEW${font}
${color3}${hr 2}

${font JetBrains Mono Nerd Font:bold:size=10}${color1}SYSTEM${font}${color}
${color2}OS       ${color}${execi 3600 grep '^NAME=' /etc/os-release | cut -d'"' -f2}
${color2}Kernel   ${color}${kernel}
${color2}Uptime   ${color}${uptime_short}
${color2}Packages ${color}${execi 600 pacman -Q | wc -l}
${color3}${voffset 4}${hr 1}

${font JetBrains Mono Nerd Font:bold:size=10}${color1}HARDWARE${font}${color}
${color2}CPU      ${color}${execi 2 grep "model name" /proc/cpuinfo | head -1 | cut -d':' -f2 | sed 's/^ //'}
${color1}${cpugraph 12,200 19A9FF 0A1628}${color} ${color1}${cpu cpu0}%${color}
${color2}GPU      ${color}${execi 5 lspci | grep -i vga | cut -d':' -f3 | sed 's/^ //'}
${color2}RAM      ${color}${mem} / ${memmax}  ${color1}${memperc}%${color}
${color1}${memgraph 12,200 19A9FF 0A1628}${color}
${color3}${voffset 4}${hr 1}

${font JetBrains Mono Nerd Font:bold:size=10}${color1}STORAGE${font}${color}
${color2}/ (root) ${color}${fs_used /} / ${fs_size /}  ${color1}${fs_used_perc /}%${color}
${color1}${execbar 12,200 19A9FF 0A1628}${color}
${color3}${voffset 4}${hr 1}

${font JetBrains Mono Nerd Font:bold:size=10}${color1}NETWORK${font}${color}
${color2}Wi-Fi    ${color}${execi 5 nmcli -t -f GENERAL.STATE device show $(nmcli -t -f DEVICE,TYPE device status | grep wifi | head -1 | cut -d: -f1) 2>/dev/null | grep -o 'connected\|disconnected\|unavailable' | head -1}
${color2}IP       ${color}${execi 30 hostname -I | awk '{print $1}'}
${color2}Down     ${color}${downspeedf} KiB/s
${color2}Up       ${color}${upspeedf} KiB/s
${color2}Bluetooth${color} ${execi 10 bluetoothctl show 2>/dev/null | grep -q "Powered: yes" && echo "On" || echo "Off"}
]]
