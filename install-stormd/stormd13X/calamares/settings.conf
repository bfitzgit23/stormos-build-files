# Configuration file for Calamares
# StormD custom settings (based on StormOS)
# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
---

modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       fixbootldr
  module:   shellprocess
  config:   shellprocess-fixbootldr.conf

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:

- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary

- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@fixbootldr
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - shellprocess
  - umount

- show:
  - finished

branding: stormd

prompt-install: false
dont-chroot: false
