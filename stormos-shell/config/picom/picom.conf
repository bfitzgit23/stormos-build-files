# StormOS Picom configuration for X11 applications
backend = "glx";
vsync = true;
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
inactive-opacity = 0.96;
active-opacity = 1.0;
frame-opacity = 0.96;
corner-radius = 10;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'i3-frame'"
];
opacity-rule = [
  "88:class_g = 'Foot'"
];
detect-client-opacity = true;
use-damage = true;
