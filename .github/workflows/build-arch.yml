name: Build StormOS Arch ISO

on:
  push:
    branches: [main]
    paths:
      - 'install-stormos-xfce/**'
      - '.github/workflows/build-arch.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub release'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release:
        description: 'Create GitHub release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # install-stormos-xfce is a complete archiso profile (profiledef.sh,
      # packages.x86_64, pacman.conf, airootfs/ and the grub/syslinux/efiboot
      # configs), so it is built as-is. Do not stage a copy of archiso's releng
      # profile: that produced an overlay missing profiledef.sh and lost the
      # profile's ISO name, package list and file permissions.
      #
      # mkarchiso must loop-mount its work directory while installing packages,
      # which GitHub's unprivileged `container:` jobs cannot do. Run it inside a
      # privileged docker container from the VM host instead.
      - name: Build ISO
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE":/repo -w /repo \
            archlinux:base-devel \
            bash -ec '
              pacman -Sy --noconfirm archlinux-keyring
              pacman -Syu --noconfirm archiso grub syslinux
              cd install-stormos-xfce
              ./build.sh -v -w ./work -o ./out
              ISO=$(ls -1 out/*.iso | head -1)
              VERSION=$(date -u +%Y%m%d)
              mv "$ISO" "out/StormOS-Arch-${VERSION}.iso"
              (cd out && sha256sum ./*.iso > SHA256SUMS)
              rm -rf ./work
            '

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: StormOS-Arch-ISO
          path: |
            install-stormos-xfce/out/*.iso
            install-stormos-xfce/out/SHA256SUMS
          retention-days: 30
          if-no-files-found: error

      - name: Create release
        # inputs.release keeps its boolean type for both workflow_dispatch and
        # workflow_call (github.event.inputs would only match a string here).
        if: inputs.release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: arch-${{ github.run_number }}
          name: StormOS Arch ${{ github.run_number }}
          files: |
            install-stormos-xfce/out/*.iso
            install-stormos-xfce/out/SHA256SUMS
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
