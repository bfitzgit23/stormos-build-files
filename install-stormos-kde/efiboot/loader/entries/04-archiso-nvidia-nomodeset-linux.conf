title   Start The StormOS Installer (NVIDIA nomodeset)
sort-key 04
linux    /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-lts
initrd   /%INSTALL_DIR%/boot/intel-ucode.img
initrd   /%INSTALL_DIR%/boot/amd-ucode.img
initrd   /%INSTALL_DIR%/boot/x86_64/initramfs-linux-lts.img
options archisobasedir=%INSTALL_DIR% cow_spacesize=10G archisolabel=%ARCHISO_LABEL% driver=nvidia nomodeset nvidia-drm.modeset=0 nvme_load=yes copytoram=no quiet splash modprobe.blacklist=nouveau