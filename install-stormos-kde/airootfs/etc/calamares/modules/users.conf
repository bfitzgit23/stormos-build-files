---
# StormOS KDE user configuration

defaultGroups:
  - name: users
    must_exist: true
    system: true
  - adm
  - audio
  - lp
  - optical
  - power
  - rfkill
  - scanner
  - storage
  - sys
  - uucp
  - video
  - wheel

# Keep the installer default conservative; users can opt into autologin.
autologinGroup: autologin
doAutologin: false

sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: true
doReusePassword: true

passwordRequirements:
  minLength: 1
  maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true

user:
  shell: /bin/bash
  forbidden_names: [ root ]
  home_permissions: "o700"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "stormos-kde"
  forbidden_names: [ localhost ]

allowActiveDirectory: false

presets:
  fullName:
    editable: true
  loginName:
    editable: true
