# Kernel and boot wiring based on eznix EzArch build files: https://sourceforge.net/projects/ezarch/ (GNU GPL v3.0)
title   Start The StormOS Installer (free)
sort-key 01
linux    /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/intel-ucode.img
initrd   /%INSTALL_DIR%/boot/amd-ucode.img
initrd   /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
options archisobasedir=%INSTALL_DIR% cow_spacesize=10G archisolabel=%ARCHISO_LABEL% driver=free radeon.modeset=1 i915.modeset=1 nvme_load=yes copytoram=no quiet splash
